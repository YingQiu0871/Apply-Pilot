<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply-Pilot</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --text: #18202b; --muted: #6b7686; --faint: #98a1ae; --line: #e3e6eb;
  --accent: #3b6cf0; --accent-soft: #e8eefd; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --applied: #3b6cf0; --responded: #12875e; --interview: #7c4ddb; --rejected: #c4431b; --evaluated: #9a7a00; --skip: #98a1ae; --warn: #b8560b;
  --applied-bg: #e8eefd; --responded-bg: #e3f5ec; --interview-bg: #efe8fb; --rejected-bg: #fbeae4; --evaluated-bg: #f8f1d8; --skip-bg: #eef0f3; --warn-bg: #fdf0e3;
  --offer: #c2378a; --offer-bg: #fbe8f3; --c-sent: #3b6cf0; --c-followup: #c77a0a; --c-reply: #12875e; --c-interview: #7c4ddb; --c-offer: #c2378a; --c-rejected: #c4431b; --c-note: #98a1ae;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface-2: #1e232d; --text: #e7eaf0; --muted: #9aa3b2; --faint: #6e7786; --line: #2a303b;
    --accent: #7aa2ff; --accent-soft: #1f2a44; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --applied: #7aa2ff; --responded: #4cd39a; --interview: #b597ff; --rejected: #ff8c66; --evaluated: #e8cc5a; --skip: #7d8696; --warn: #ffb35c;
    --applied-bg: #1f2a44; --responded-bg: #173528; --interview-bg: #2a2244; --rejected-bg: #3a2119; --evaluated-bg: #353016; --skip-bg: #232831; --warn-bg: #3a2a14;
    --c-sent: #5f86ea; --c-followup: #c98424; --c-reply: #2ba574; --c-interview: #9478e6; --c-offer: #d95fa0; --c-rejected: #df6c2e; --c-note: #6e7786; --offer: #f08ac4; --offer-bg: #3a1f30;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface-2: #1e232d; --text: #e7eaf0; --muted: #9aa3b2; --faint: #6e7786; --line: #2a303b;
  --accent: #7aa2ff; --accent-soft: #1f2a44; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --applied: #7aa2ff; --responded: #4cd39a; --interview: #b597ff; --rejected: #ff8c66; --evaluated: #e8cc5a; --skip: #7d8696; --warn: #ffb35c;
  --applied-bg: #1f2a44; --responded-bg: #173528; --interview-bg: #2a2244; --rejected-bg: #3a2119; --evaluated-bg: #353016; --skip-bg: #232831; --warn-bg: #3a2a14;
  --c-sent: #5f86ea; --c-followup: #c98424; --c-reply: #2ba574; --c-interview: #9478e6; --c-offer: #d95fa0; --c-rejected: #df6c2e; --c-note: #6e7786; --offer: #f08ac4; --offer-bg: #3a1f30;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 "Inter", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* layout */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 650; font-size: 15px; }
.logo { width: 28px; height: 28px; display: block; }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav:hover { background: var(--surface-2); color: var(--text); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 0 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.nav.on .badge { background: var(--surface); color: var(--accent); }
.nav .badge.warn { background: var(--warn-bg); color: var(--warn); }
.side-foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); display: grid; gap: 8px; }
.live { display: flex; align-items: center; gap: 7px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--skip); }
.dot.on { background: var(--responded); box-shadow: 0 0 0 3px color-mix(in srgb, var(--responded) 20%, transparent); }
.mini { display: flex; gap: 6px; }
.mini button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }

main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.view { display: none; }
.view.on { display: block; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 6px; }
.card-h h2 { margin: 0; font-size: 14px; font-weight: 620; }
.card-h .link { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: 0; }
.card-b { padding: 6px 18px 16px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 16px; }
.kpi { padding: 16px 18px; cursor: pointer; text-align: left; border: 1px solid var(--line); transition: border-color .15s, transform .15s; }
.kpi:hover { border-color: var(--accent); transform: translateY(-1px); }
.kpi .n { font-size: 28px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.kpi .l i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.kpi .l .bi small { display: block; margin-left: 0; }
.kpi .sub { margin-top: 6px; color: var(--faint); font-size: 11.5px; line-height: 1.5; }
.two { grid-template-columns: 1.3fr 1fr; }

/* lists */
.item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.item:first-child { border-top: 0; }
.item:hover .t1 { color: var(--accent); }
.t1 { font-weight: 560; overflow-wrap: anywhere; }
.t2 { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.grow { flex: 1; min-width: 0; }
.meta { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { padding: 26px 0; text-align: center; color: var(--muted); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-Applied { color: var(--applied); background: var(--applied-bg); }
.s-Responded { color: var(--responded); background: var(--responded-bg); }
.s-Interview { color: var(--interview); background: var(--interview-bg); }
.s-Offer { color: var(--offer); background: var(--offer-bg); }
.s-Rejected { color: var(--rejected); background: var(--rejected-bg); }
.s-Evaluated { color: var(--evaluated); background: var(--evaluated-bg); }
.s-SKIP, .s-Discarded { color: var(--skip); background: var(--skip-bg); }
.k-rejected { color: var(--rejected); background: var(--rejected-bg); }
.k-reply, .k-ack { color: var(--responded); background: var(--responded-bg); }
.k-offer { color: var(--offer); background: var(--offer-bg); }
.k-interview { color: var(--interview); background: var(--interview-bg); }
.k-followup { color: var(--warn); background: var(--warn-bg); }
.k-sent { color: var(--applied); background: var(--applied-bg); }
.k-note { color: var(--skip); background: var(--skip-bg); }
.bi small { font-size: .92em; font-weight: 500; opacity: .72; margin-left: 5px; }
.stage { margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.stage .bi small { margin-left: 4px; }

/* toolbar */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; width: 100%; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: 9px; background: var(--surface-2); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.count { color: var(--faint); font-size: 12px; }

/* table */
.table { width: 100%; }
.tr { display: grid; grid-template-columns: 56px minmax(0, 1.1fr) minmax(0, 1.6fr) 64px 150px 108px; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--line); cursor: pointer; }
.tr:hover { background: var(--surface-2); }
.tr.head { cursor: default; color: var(--faint); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; background: none; border-top: 0; padding-top: 10px; padding-bottom: 8px; }
.tr .num { color: var(--faint); font-variant-numeric: tabular-nums; }
.tr .co { font-weight: 580; overflow-wrap: anywhere; }
.tr .role { color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tr .score { font-variant-numeric: tabular-nums; color: var(--muted); }
.age { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.35; }
.age.warn { color: var(--warn); font-weight: 600; }
.more { padding: 14px; text-align: center; }

/* timeline */
.day { padding: 14px 18px 6px; font-size: 12px; font-weight: 620; color: var(--muted); }
.ev-list { padding: 0 18px 8px; }
.ev { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
.ev.dated { grid-template-columns: 46px 26px minmax(0, 1fr); }
.ev[data-open] { cursor: pointer; }
.ev[data-open]:hover .ev-title { color: var(--accent); }
.ev-when { padding-top: 3px; text-align: right; font-size: 11.5px; line-height: 1.4; color: var(--faint); font-variant-numeric: tabular-nums; }
.ev-when b { display: block; color: var(--muted); font-weight: 600; }
.ev-node { position: relative; display: flex; justify-content: center; }
.ev-node::before { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 1px); width: 2px; background: var(--line); }
.ev:first-child .ev-node::before { top: 13px; }
.ev:last-child .ev-node::before { bottom: calc(100% - 13px); }
.ev-gap .ev-node::before { background: repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px); }
.ev-dot { position: relative; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--g); border: 1.5px solid var(--g); background: color-mix(in srgb, var(--g) 16%, var(--surface)); }
.ev-dot svg { width: 13px; height: 13px; }
.g-ack .ev-dot { border-style: dashed; background: var(--surface); }
.g-note .ev-dot { background: var(--surface); }
.g-sent { --g: var(--c-sent); } .g-followup { --g: var(--c-followup); } .g-reply, .g-ack { --g: var(--c-reply); } .g-interview { --g: var(--c-interview); } .g-offer { --g: var(--c-offer); } .g-rejected { --g: var(--c-rejected); } .g-note { --g: var(--c-note); }
.ev-body { min-width: 0; padding: 2px 0 14px; }
.ev-title { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-weight: 600; font-size: 13px; line-height: 22px; }
.ev-co { color: var(--muted); font-weight: 500; overflow-wrap: anywhere; }
.chip { font-size: 11px; font-weight: 500; line-height: 16px; padding: 0 6px; border-radius: 5px; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
.ev-text { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.ev-text.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ev-more { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12px; cursor: pointer; }
.ev-gap { min-height: 26px; align-items: center; }
.ev-gap .ev-body { padding: 0; font-size: 11.5px; color: var(--faint); }

/* progress steps */
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 4px 0 18px; }
.step { position: relative; text-align: center; font-size: 11.5px; color: var(--faint); line-height: 1.35; }
.step::before { content: ''; position: absolute; top: 7px; left: -50%; width: 100%; height: 2px; background: var(--line); }
.step:first-child::before { display: none; }
.step i { position: relative; display: block; width: 16px; height: 16px; margin: 0 auto 6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.step.on { color: var(--text); font-weight: 600; }
.step.on::before { background: var(--c-sent); }
.step.on i { background: var(--c-sent); border-color: var(--c-sent); }
.step.bad i { background: var(--c-rejected); border-color: var(--c-rejected); }
.step.good i { background: var(--c-offer); border-color: var(--c-offer); }
.step.off i { background: var(--c-note); border-color: var(--c-note); }
.step small { display: block; font-weight: 400; color: var(--muted); }
.step .date { color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.d-body details { margin-top: 14px; }
.d-body summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.d-body details .notes { margin-top: 8px; }

/* activity chart */
.chart { position: relative; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.chart h2 { margin: 0 0 12px; font-size: 13px; font-weight: 620; }
.plot { position: relative; height: 132px; display: flex; align-items: stretch; gap: 2px; border-bottom: 1px solid var(--line); }
.plot .grid-line { position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed var(--line); }
.plot .grid-max { position: absolute; top: 2px; left: 0; font-size: 11px; color: var(--faint); background: var(--surface); padding-right: 4px; font-variant-numeric: tabular-nums; }
.col { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; cursor: pointer; border-radius: 4px 4px 0 0; }
.col:hover, .col.on { background: var(--surface-2); }
.col .seg-bar { width: min(100%, 26px); flex: none; }
.col .seg-bar:last-child { border-radius: 4px 4px 0 0; }
.seg-bar.dim { opacity: .22; }
.axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 5; pointer-events: none; display: none; min-width: 132px; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); font-size: 12px; }
.tip b { display: block; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.tip div span { margin-left: auto; padding-left: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
.swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; display: inline-block; background: var(--g); }
.g-ack .swatch { background: none; border: 1.5px dashed var(--g); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 13px; cursor: pointer; font-size: 13px; font-weight: 560; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }

/* tools */
.tasks { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.task { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.task h3 { margin: 0; font-size: 14px; }
.task p { margin: 0; color: var(--muted); font-size: 12.5px; flex: 1; }
.ag-pills { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.ag-note { min-height: 44px; font-size: 12px; color: var(--faint); }
.ag-note details { margin-top: 4px; }
.ag-note summary { cursor: pointer; }
.ag-note pre { margin: 6px 0 0; max-height: 140px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: inherit; }
.console { background: #0d1117; color: #c9d1d9; border-radius: 10px; padding: 12px 14px; font: 12px/1.5 ui-monospace, Consolas, monospace; height: 260px; overflow: auto; white-space: pre-wrap; margin: 0; }
.status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
.spin.on { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* data folder picker */
.setup { position: fixed; inset: 0; background: var(--bg); display: none; place-items: center; z-index: 30; padding: 16px; overflow: auto; }
.setup.on { display: grid; }
.setup-card { width: min(560px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.setup-card h1 { margin: 4px 0 0; font-size: 22px; }
.setup-card p { margin: 0; color: var(--muted); }
.home-check { color: var(--muted); font-size: 12.5px; min-height: 18px; white-space: normal; }
.home-check.warn { color: var(--warn); }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .22s ease; z-index: 21; display: flex; flex-direction: column; }
.drawer.on { transform: none; box-shadow: -8px 0 24px rgba(0, 0, 0, .12); }
.d-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
.d-head .x { float: right; border: 0; background: var(--surface-2); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; color: var(--muted); }
.d-head h3 { margin: 0 0 4px; font-size: 17px; padding-right: 40px; }
.d-head .sub { color: var(--muted); }
.d-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.d-body { padding: 16px 22px 28px; overflow: auto; }
.d-body h4 { margin: 14px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
.notes { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; color: var(--muted); background: var(--surface-2); padding: 10px 12px; border-radius: 8px; }
.err { display: none; padding: 10px 14px; border-radius: 9px; background: var(--rejected-bg); color: var(--rejected); margin-bottom: 14px; }

/* mobile */
.work { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: block; margin-bottom: 12px; font-size: 12px; color: var(--muted); }
.field input, .field textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; line-height: 1.5; box-sizing: border-box; }
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.su-step { display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.su-step:first-child { border-top: 0; padding-top: 0; }
.su-step:last-child { padding-bottom: 0; }
.su-n { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.su-step.done .su-n { background: var(--responded-bg); color: var(--responded); }
.su-body { flex: 1; min-width: 0; }
.su-body h3 { margin: 2px 0 4px; font-size: 14px; }
.su-body p { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.rv { margin-bottom: 12px; padding: 16px; }
.rv-head { display: flex; gap: 12px; align-items: flex-start; }
.rv-head .grow { flex: 1; min-width: 0; }
.rv-score { font-size: 24px; font-weight: 650; line-height: 1; text-align: right; }
.rv p { margin: 10px 0 0; font-size: 13px; line-height: 1.55; }
.rv ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); line-height: 1.55; }
.rv details { margin-top: 8px; font-size: 12px; color: var(--muted); }
.rv .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.rv .warn-line { margin-top: 8px; font-size: 12px; color: var(--warn); }
.rv .bad-line { margin-top: 8px; font-size: 12px; color: var(--rejected); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 8px 12px; z-index: 10; border-right: 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .brand { padding: 0 10px 0 0; }
  .brand span, .side-foot { display: none; }
  #navs { display: flex; gap: 2px; }
  .nav { width: auto; white-space: nowrap; }
  main { padding: 18px 16px 48px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .two { grid-template-columns: 1fr; }
  .tr { grid-template-columns: minmax(0, 1fr) auto; }
  .tr.head, .tr .num, .tr .score { display: none; }
  .tr .role { grid-column: 1 / -1; }
}

    </div>

  <main>

    <section class="view" data-view="applications">
      <div class="page-head"><div><h1 data-t="appsTitle"></h1><p data-t="appsSub"></p></div></div>
      <div class="card">
        <div class="toolbar">
          <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search"></label>
          <div class="seg" id="filters"></div>
          <span class="count" id="count"></span>
          <div class="seg" id="stages" style="flex-basis:100%;display:none"></div>
        </div>
        <div class="table" id="table"></div>
      </div>
    </section>

    <section class="view" data-view="followups">
      <div class="page-head"><div><h1 data-t="fuTitle"></h1><p id="fuSub"></p></div></div>
      <div class="grid" id="fuGroups"></div>
    </section>

    <section class="view" data-view="activity">
      <div class="page-head"><div><h1 data-t="actTitle"></h1><p data-t="actSub"></p></div></div>
      <div class="card">
        <div class="toolbar"><div class="seg" id="periods"></div><div class="seg" id="kinds"></div><div class="seg" id="evTypes" style="flex-basis:100%;display:none"></div></div>
        <div class="chart" id="actChart"></div>
        <div id="timeline"></div>
      </div>
    </section>

    <section class="view" data-view="agents">
      <div class="page-head"><div><h1 data-t="agentsTitle"></h1><p data-t="agentsSub"></p></div><button class="btn" data-act="agent-refresh" data-t="agRefresh"></button></div>
      <div class="grid tasks" id="agentCards" style="margin-bottom:16px"></div>
      <p class="meta" style="white-space:normal" data-t="agSafe"></p>
    </section>

    <section class="view" data-view="tools">
      <div class="page-head"><div><h1 data-t="toolsTitle"></h1><p data-t="toolsSub"></p></div>
        <div class="mini" style="gap:8px"><button class="btn" data-act="open-data" data-t="openData"></button><button class="btn" data-act="quit" data-t="quit"></button></div></div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h2 data-t="homeTitle"></h2></div>
        <div class="card-b"><p class="meta" style="white-space:normal;margin:0 0 10px" id="homeNow"></p><div id="homeTools"></div></div>
      </div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-h"><h2 data-t="impTitle"></h2></div>
        <div class="card-b">
          <p class="meta" style="white-space:normal;margin:0 0 10px" data-t="impHelp"></p>

        </div>
      </div>

        <div class="card-h"><h2 data-t="output"></h2><div class="status-line"><span class="spin" id="spin"></span><span id="runState"></span></div></div>
        <div class="card-b"><pre class="console" id="console"></pre><div class="meta" id="inbox" style="margin-top:10px;white-space:normal"></div></div>
      </div>
    </section>
  </main>
</div>

<div class="scrim" id="scrim"></div>

// One event on a rail, shared by the drawer and the Activity page.
function evRow(e, { row = null, company = false, id = '' } = {}) {
  const long = !row && e.text.length > 220;
  const when = row ? '' : `<div class="ev-when"><b>${e.date.slice(5)}</b>${e.time || e.date.slice(0, 4)}</div>`;
  const send = e.sendAt ? `<span class="chip">${T.scheduled} ${esc(e.sendAt.slice(5))}</span>` : '';
  const who = company ? `<span class="ev-co">#${row.num} ${esc(row.company)}</span>` : '';
  return `<div class="ev ${row ? '' : 'dated'} g-${e.kind}" ${row ? `data-open="${row.num}"` : ''}>${when}
    <div class="ev-node"><span class="ev-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${EVENT_ICONS[e.type]}</svg></span></div>
    <div class="ev-body"><div class="ev-title">${bi(BI.type[e.type])}${send}${who}</div>
      <div class="ev-text ${long || row ? 'clamp' : ''}" id="${id}">${esc(e.text)}</div>
      ${long ? `<button class="ev-more" data-expand="${id}">${T.expand}</button>` : ''}</div></div>`;
}

// Five steps of one application, each dated by its first event.
function stepsOf(r) {
  const first = (...kinds) => r.events.find((e) => kinds.includes(e.kind))?.date;
  const rank = { Applied: 1, Responded: 2, Interview: 3, Offer: 4, Rejected: 4 }[r.status] || 0;
  const sent = first('sent'), reply = first('reply'), talk = first('interview');
  const end = r.events.findLast((e) => ['rejected', 'offer'].includes(e.kind))?.date;
  const closed = ['SKIP', 'Discarded'].includes(r.status);
  const steps = [
    { on: true, date: r.date },
    { on: rank >= 1 || Boolean(sent), date: sent },
    { on: rank >= 2 || Boolean(reply), date: reply },
    { on: rank === 3 || Boolean(talk) || r.status === 'Offer', date: talk },
    { on: rank === 4 || closed, date: end, cls: r.status === 'Rejected' ? 'bad' : r.status === 'Offer' ? 'good' : closed ? 'off' : '' },
  ];
  return `<div class="steps">${steps.map((s, i) => `<div class="step ${s.on ? 'on' : ''} ${s.cls || ''}"><i></i>${pick(BI.step[i])}<small>${pick([...BI.step[i]].reverse())}</small>${s.on && s.date ? `<span class="date">${s.date.slice(5)}</span>` : ''}</div>`).join('')}</div>`;
}

const S = { review: [], edits: {}, tests: {}, testing: null, draft: {}, rvErr: {}, ready: null, lastRun: null, rows: [], view: read('ap-view') || 'today', filter: read('ap-filter') || 'active', q: '', limit: 60, period: Number(read('ap-period')) || 7, kind: 'all', evType: null, day: null, stage: null, followDays: 14, running: null, inbox: [] };

function setView(v) {
  S.view = v; store('ap-view', v);
  document.querySelectorAll('.view').forEach((el) => el.classList.toggle('on', el.dataset.view === v));
  renderNav(); render();
  if (location.hash !== `#${v}`) history.replaceState(null, '', `#${v}`);
}

function renderNav() {
  const badge = { today: S.review.length, followups: S.rows.filter(FILTERS.follow).length, applications: S.rows.filter(FILTERS.active).length };
  $('navs').innerHTML = Object.keys(T.nav).map((v) => `<button class="nav ${S.view === v ? 'on' : ''}" data-go="${v}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[v]}</svg>${T.nav[v]}
    ${badge[v] ? `<span class="badge ${v === 'followups' ? 'warn' : ''}">${badge[v]}</span>` : ''}
    ${v === 'tools' && S.running ? '<span class="spin on" style="margin-left:auto"></span>' : ''}</button>`).join('');
}

function eventsSince(n, notes = false) {
  return S.rows.filter((r) => !['SKIP', 'Discarded'].includes(r.status))
    .flatMap((r) => r.events.filter((e) => days(e.date) <= n && (notes || e.kind !== 'note')).map((e) => ({ ...e, r })))
    .sort((a, b) => b.date.localeCompare(a.date) || b.r.num - a.r.num);
}

function renderOverview() {
  const active = S.rows.filter(FILTERS.active).length;
  $('overviewSub').textContent = T.overviewSub(S.rows.length, active);
  $('kpis').innerHTML = Object.keys(T.k).map((id) => {
    const list = S.rows.filter(FILTERS[id]);
    const parts = Object.entries(BI.stage).map(([k, p]) => [p, list.filter((r) => r.stage === k).length]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const sub = id === 'follow' ? '' : parts.map(([p, n]) => `${pick(p)} ${n}`).join(' · ');
    return `<button class="card kpi" data-kpi="${id}"><div class="n">${list.length}</div><div class="l"><i style="background:${KPI_COLORS[id]}"></i>${bi(both('k', id))}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</button>`;
  }).join('');
  const replies = S.rows.filter(FILTERS.reply);
  const due = S.rows.filter(FILTERS.follow).sort((a, b) => days(b.lastActivity) - days(a.lastActivity));
  const items = [...replies.map((r) => ({ r, meta: `<div style="text-align:right">${pill(r.status)}${stageTag(r)}</div>` })), ...due.slice(0, 6).map((r) => ({ r, meta: `<span class="age warn">${T.quiet(days(r.lastActivity))}</span>` }))];
  $('ovAction').innerHTML = items.length ? items.map(({ r, meta }) => `<div class="item" data-open="${r.num}"><div class="grow"><div class="t1">${esc(r.company)}</div><div class="t2">${esc(r.role)}</div></div>${meta}</div>`).join('') : `<div class="empty">${T.emptyAction}</div>`;
  const ev = eventsSince(7).slice(0, 8);
  $('ovFeed').innerHTML = ev.length ? ev.map((e) => `<div class="item" data-open="${e.r.num}"><div class="grow"><div class="t1">${esc(e.r.company)}</div><div class="t2">${esc(e.text)}</div></div><div style="text-align:right">${tpill(e)}<div class="meta">${e.date.slice(5)}</div></div></div>`).join('') : `<div class="empty">${T.emptyFeed}</div>`;
}

function renderApps() {

  const q = S.q.trim().toLowerCase();
  const scoped = S.rows.filter(FILTERS[S.filter]).filter((r) => !q || `${r.num} ${r.company} ${r.role} ${r.notes}`.toLowerCase().includes(q));
  const stages = ['applied', 'reply', 'pending', 'rejected'].includes(S.filter) ? Object.keys(BI.stage).filter((k) => scoped.some((r) => r.stage === k)) : [];

function renderChart(all) {
  const dates = Array.from({ length: S.period + 1 }, (_, i) => new Date(today() - (S.period - i) * 864e5).toISOString().slice(0, 10));
  const outward = all.filter((e) => e.kind !== 'note');
  const byDay = Object.fromEntries(dates.map((d) => [d, {}]));
  outward.forEach((e) => { const c = byDay[e.date]; if (c) { const k = chartKind(e.kind); c[k] = (c[k] || 0) + 1; } });
  const totals = dates.map((d) => Object.values(byDay[d]).reduce((a, b) => a + b, 0));
  const max = Math.max(...totals);
  if (!max) { $('actChart').innerHTML = `<h2>${bi(BI.ui.chart)}</h2><div class="empty">${T.chartEmpty}</div>`; return; }
  const dim = (k) => (S.kind !== 'all' && chartKind(S.kind) !== k ? 'dim' : '');
  const cols = dates.map((d, i) => `<div class="col ${S.day === d ? 'on' : ''}" data-day="${d}">${CHART_KINDS.filter((k) => byDay[d][k]).map((k) => `<div class="seg-bar g-${k} ${dim(k)}" style="height:${Math.max(3, (byDay[d][k] / max) * 124)}px;background:var(--g)"></div>`).join('')}</div>`).join('');
  $('actChart').innerHTML = `<h2>${bi(BI.ui.chart)}</h2><div class="plot" id="plot"><div class="grid-line"></div><span class="grid-max">${max}</span>${cols}</div>
    <div class="axis"><span>${dates[0].slice(5)}</span><span>${dates[Math.floor(S.period / 2)].slice(5)}</span><span>${dates.at(-1).slice(5)}</span></div><div class="tip" id="tip"></div>`;
  const tip = $('tip');
  $('plot').onmousemove = (ev) => {
    const col = ev.target.closest('.col');
    if (!col) { tip.style.display = 'none'; return; }
    const d = col.dataset.day;
    const rows = CHART_KINDS.filter((k) => byDay[d][k]).map((k) => `<div class="g-${k}"><i class="swatch"></i>${pick(BI.kind[k])}<span>${byDay[d][k]}</span></div>`).join('');
    tip.innerHTML = `<b>${d}</b>${rows || `<div>0</div>`}`;
    tip.style.display = 'block';
    const box = $('actChart').getBoundingClientRect();
    tip.style.left = `${Math.min(ev.clientX - box.left + 12, box.width - tip.offsetWidth - 8)}px`;
    tip.style.top = `${ev.clientY - box.top - 10}px`;
  };
  $('plot').onmouseleave = () => { tip.style.display = 'none'; };
}

function renderActivity() {
  $('periods').innerHTML = [7, 14, 30, 90].map((d) => `<button class="${S.period === d ? 'on' : ''}" data-period="${d}">${T.days(d)}</button>`).join('');
  const all = eventsSince(S.period, true);
  const counts = {};
  all.forEach((e) => { counts[e.kind] = (counts[e.kind] || 0) + 1; });
  const outward = all.filter((e) => e.kind !== 'note').length;
  $('kinds').innerHTML = [`<button class="${S.kind === 'all' ? 'on' : ''}" data-kind="all">${T.all} ${outward}</button>`,
    ...['sent', 'followup', 'ack', 'reply', 'interview', 'offer', 'rejected', 'note'].filter((k) => counts[k] || S.kind === k).map((k) => `<button class="${S.kind === k ? 'on' : ''}" data-kind="${k}"><span class="g-${k}" style="display:inline-flex;align-items:center;gap:5px"><i class="swatch"></i>${bi(BI.kind[k])} ${counts[k] || 0}</span></button>`)].join('');
  const inKind = S.kind === 'all' ? all.filter((e) => e.kind !== 'note') : all.filter((e) => e.kind === S.kind);
  const types = S.kind === 'all' ? [] : Object.keys(BI.type).filter((t) => inKind.some((e) => e.type === t));

function openDrawer(num) {
  const r = S.rows.find((x) => x.num === Number(num));
  if (!r) return;
  $('dHead').innerHTML = `<button class="x" data-close>×</button><h3>${esc(r.company)}</h3><div class="sub">${esc(r.role)}</div>
    <div class="d-meta">${pill(r.status)}${r.stage ? `<span class="chip">${bi(BI.stage[r.stage])}</span>` : ''}<span class="meta">#${r.num} · ${T.added} ${esc(r.date)}</span>${r.score != null ? `<span class="meta">${T.score} ${r.score}</span>` : ''}
    ${r.due ? `<span class="pill k-followup">${T.quiet(days(r.lastActivity))}</span>` : ''}</div>
    ${r.url ? `<div style="margin-top:14px"><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">${T.open} ↗</a></div>` : ''}`;
  const ev = [...r.events].reverse();
  const gap = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
  const rail = ev.map((e, i) => {
    const next = ev[i + 1];
    const n = next ? gap(e.date, next.date) : 0;
    return evRow(e, { id: `ev${i}` }) + (n > 1 ? `<div class="ev dated ev-gap"><div></div><div class="ev-node"></div><div class="ev-body">${bi([`间隔 ${n} 天`, `${n} days`])}</div></div>` : '');
  }).join('');
  $('dBody').innerHTML = stepsOf(r) + (ev.length ? `<h4>${bi(BI.ui.timeline)}</h4><div>${rail}</div>` : '')
    + `<details><summary>${T.notes}</summary><div class="notes">${esc(r.notes || '—')}</div></details>`;
  $('drawer').classList.add('on'); $('scrim').classList.add('on');
}
const closeDrawer = () => { $('drawer').classList.remove('on'); $('scrim').classList.remove('on'); };

// A 403 means the server restarted and issued a new token: reload to pick it up.
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-token': TOKEN }, body: JSON.stringify(body || {}) })
  .then((r) => { if (r.status === 403) { location.reload(); return { ok: false, error: 'reloading' }; } return r.json(); });
function log(text) {
  for (const id of ['console', 'todayConsole']) logTo($(id), text);
}
function logTo(c, text) {
  c.textContent += `${text}\n`;
  const lines = c.textContent.split('\n');
  if (lines.length > 500) c.textContent = lines.slice(-500).join('\n');
  c.scrollTop = c.scrollHeight;
}

// Data folder picker, used by the first-run screen and the Tools page.
function homeForm(id, value) {
  if ($(`${id}Path`)) return;
  $(id).innerHTML = `<div class="toolbar" style="padding:0;border:0;gap:8px"><label class="search"><input id="${id}Path" type="text" spellcheck="false" value="${esc(value)}"></label>
    <button class="btn primary" data-home="${id}" data-t="homeUse">${T.homeUse}</button></div><div class="home-check" id="${id}Check" style="margin-top:8px"></div>`;
  let t = null;
  $(`${id}Path`).addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => checkHome(id), 350); });
  checkHome(id);
}
async function checkHome(id) {
  const path = $(`${id}Path`).value.trim();
  const out = $(`${id}Check`);
  out.classList.remove('warn');
  if (!path) { out.textContent = ''; return; }
  const r = await post('/api/home/check', { path });
  out.textContent = !r.ok ? r.error : r.isFile ? T.homeIsFile : (r.hasProfile || r.hasTracker) ? T.homeFound(r.rows) : T.homeNew;
}
async function useHome(id) {
  const out = $(`${id}Check`);
  const r = await post('/api/home/use', { path: $(`${id}Path`).value.trim(), create: true });
  if (!r.ok) { out.textContent = r.error; out.classList.add('warn'); return; }
  out.textContent = T.homeSwitched(r.home) + (r.envOverride ? ` ${T.homeEnv}` : '');
  out.classList.toggle('warn', Boolean(r.envOverride));
  load();
}
function renderHome() {
  if (!S.home) return;
  $('setup').classList.toggle('on', Boolean(S.home.setup));
  if (S.home.setup) homeForm('homeSetup', S.home.suggested.home);
  $('homeNow').textContent = T.homeNow(S.home.path, T.homeSrc[S.home.source]);
  homeForm('homeTools', S.home.path);
}

// Prefill the setup form once, leaving out the template's placeholder lines.
function fillDraft(c) {
  if (S.draftFilled || !c) return;
  S.draftFilled = true;
  const real = (s) => !/\breplace (with|this)\b|^these are the only/i.test(String(s).trim());
  Object.assign(S.draft, { summary: real(c.summary) ? c.summary : '', facts: c.facts.filter(real).join('\n'), languages: c.languages.join('\n') });
}

const draftRe = () => Object.fromEntries(['summary', 'facts', 'languages', 'keywords', 'cv'].map((k) => [k, S.draft[k] || '']));

function mailUrl(d) {
  return `mailto:${encodeURIComponent(d.to || '').replace(/%40/g, '@')}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.body)}`;
}

async function load() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) throw new Error(await res.text());
    const d = await res.json();
    Object.assign(S, { home: d.home, rows: d.rows, followDays: d.followUpDays, running: d.running, inbox: d.inbox || [], agents: d.agents, agent: d.agent, review: d.review || [], ready: d.ready, lastRun: d.lastRun });
    fillDraft(d.candidate);
    $('updated').textContent = `${d.rows.length} ${T.rows} · ${new Date(d.generated).toLocaleTimeString()}`;
    $('err').style.display = 'none';
    renderNav(); render(); renderHome();
  } catch (e) { $('err').textContent = e.message; $('err').style.display = 'block'; }
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-go],[data-kpi],[data-filter],[data-stage],[data-period],[data-kind],[data-evtype],[data-day],[data-expand],[data-open],[data-close],[data-more],[data-task],[data-act],[data-agent],[data-launch],[data-imp],[data-home],[data-review],[data-rvcopy],[data-rvmail],[data-test],[data-key],[data-suread],[data-susave],#langBtn,#themeBtn,#scrim');
  if (!t) return;
  if (t.dataset.go) return setView(t.dataset.go);
  if (t.dataset.kpi) { S.filter = t.dataset.kpi; store('ap-filter', S.filter); S.stage = null; S.limit = 60; return setView(t.dataset.kpi === 'follow' ? 'followups' : 'applications'); }
  if (t.dataset.filter) { S.filter = t.dataset.filter; store('ap-filter', S.filter); S.stage = null; S.limit = 60; return render(); }
  if (t.dataset.stage !== undefined) { S.stage = t.dataset.stage || null; S.limit = 60; return render(); }
  if (t.dataset.period) { S.period = Number(t.dataset.period); S.day = null; store('ap-period', S.period); return render(); }
  if (t.dataset.kind) { S.kind = t.dataset.kind; S.evType = null; return render(); }
  if (t.dataset.evtype !== undefined) { S.evType = t.dataset.evtype || null; return render(); }
  if (t.dataset.day) { S.day = S.day === t.dataset.day ? null : t.dataset.day; return render(); }
  if (t.dataset.expand) { const on = $(t.dataset.expand).classList.toggle('clamp'); t.textContent = on ? T.expand : T.collapse; return; }
  if (t.dataset.open) return openDrawer(t.dataset.open);
  if (t.hasAttribute('data-close') || t.id === 'scrim') return closeDrawer();
  if (t.hasAttribute('data-more')) { S.limit += 100; return render(); }
  if (t.dataset.imp) {
    const path = $('impPath').value.trim();
    store('ap-import-path', path);
    $('impResult').innerHTML = '<span class="spin on"></span>';
    const r = await post(`/api/import/${t.dataset.imp}`, { path });
    if (!r.ok) { $('impResult').innerHTML = `<div class="err" style="display:block">${esc(r.error)}</div>`; return; }
    const src = r.sources.map((x) => `<div class="meta" style="white-space:normal">${esc(x.file)}${x.sheet ? ` › ${esc(x.sheet)}` : ''}: ${x.rows}</div>`).join('');
    const rows = r.sample.map((x) => `<div class="item"><div class="grow"><div class="t1">${esc(x.company)}</div><div class="t2">${esc(x.role)}</div></div>${pill(x.status)}</div>`).join('');
    $('impResult').innerHTML = `<div class="status-line" style="margin-bottom:8px"><b>${T.impFiles(r.files, r.sources.length)}</b> · ${T.impCounts(r.fresh, r.duplicates)}${r.added ? ` · <b>${T.impDone(r.added.length)}</b>` : ''}</div>${src}${r.errors.map((e) => `<div class="meta" style="color:var(--rejected)">${esc(e)}</div>`).join('')}<div style="margin-top:8px">${rows || `<div class="empty">${T.impNone}</div>`}</div>`;
    $('impWriteBtn').disabled = Boolean(r.added) || !r.fresh;
    if (r.added) load();
    return;
  }
  if (t.dataset.home) return useHome(t.dataset.home);
  if (t.dataset.review) {
    const id = t.dataset.id;
    const r = await post('/api/review/decide', { id, action: t.dataset.review, edits: S.edits[id] });
    if (!r.ok) { S.rvErr[id] = r.error; renderToday(); return; }
    delete S.edits[id]; delete S.rvErr[id];
    if (r.folder) log(T.rvLetterSaved(r.folder, r.pdf));
    return load();
  }
  if (t.dataset.rvcopy) {
    const it = S.review.find((i) => i.id === t.dataset.rvcopy);
    await navigator.clipboard.writeText({ ...it.payload, ...S.edits[it.id] }.body);
    t.textContent = T.rvCopied;
    return;
  }
  if (t.dataset.rvmail) { const it = S.review.find((i) => i.id === t.dataset.rvmail); location.href = mailUrl({ ...it.payload, ...S.edits[it.id] }); return; }
  if (t.dataset.test) {
    S.testing = t.dataset.test; render();
    S.tests[t.dataset.test] = await post('/api/agent/test', { agent: t.dataset.test });
    S.testing = null;
    return load();
  }
  if (t.dataset.key) {
    const box = $(`key-${t.dataset.key}`);
    const r = await post('/api/agent/key', { agent: t.dataset.key, key: box.value });
    S.tests[t.dataset.key] = r.ok ? null : { ok: false, reason: 'other', detail: r.error };
    box.value = '';
    await post('/api/agent/refresh');
    return load();
  }
  if (t.hasAttribute('data-suread')) {
    S.reading = true; document.activeElement?.blur(); renderSetup();
    const r = await post('/api/profile/draft', { text: S.draft.cv });
    S.reading = false;
    if (r.ok) Object.assign(S.draft, { summary: r.draft.summary, facts: r.draft.facts.join('\n'), languages: r.draft.languages.join('\n'), keywords: r.draft.keywords.join('\n') });
    renderSetup();
    if (!r.ok && $('suErr')) $('suErr').textContent = r.error;
    return;
  }
  if (t.hasAttribute('data-susave')) {
    document.activeElement?.blur();
    const r = await post('/api/profile/save', draftRe());
    if (!r.ok && $('suErr')) { $('suErr').textContent = r.error; return; }
    return load();
  }
  if (t.dataset.agent) { await post('/api/agent/select', { agent: t.dataset.agent }); return load(); }
  if (t.dataset.launch) { await post('/api/agent/launch', { agent: t.dataset.launch }); return; }
  if (t.dataset.act === 'agent-refresh') { const r = await post('/api/agent/refresh'); if (r.agents) S.agents = r.agents; return render(); }
  if (t.dataset.task) { $('console').textContent = ''; $('todayConsole').textContent = ''; const r = await post('/api/run', { task: t.dataset.task }); if (!r.ok) log(`! ${r.error}`); return; }
  if (t.dataset.act === 'quit') { await post('/api/quit'); $('runState').textContent = T.bye; $('dot').classList.remove('on'); es.close(); return; }
  if (t.dataset.act) return post(`/api/${t.dataset.act}`);
  if (t.id === 'langBtn') { LANG = LANG === 'zh' ? 'en' : 'zh'; store('ap-lang', LANG); T = I18N[LANG]; renderNav(); return render(); }
  if (t.id === 'themeBtn') {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next; store('ap-theme', next);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
$('q').addEventListener('input', (e) => { S.q = e.target.value; S.limit = 60; renderApps(); });
$('reviewList').addEventListener('input', (e) => { const { edit, k } = e.target.dataset; if (edit) (S.edits[edit] ||= {})[k] = e.target.value; });
$('setupSteps').addEventListener('input', (e) => { const { draft } = e.target.dataset; if (draft) S.draft[draft] = e.target.value; });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && T.nav[v]) setView(v); });

const theme = read('ap-theme'); if (theme) document.documentElement.dataset.theme = theme;
$('updated').textContent = T.connecting;
$('impPath').value = read('ap-import-path') || '';
$('impPath').addEventListener('input', () => { $('impWriteBtn').disabled = true; });
const es = new EventSource('/events');
es.onopen = () => $('dot').classList.add('on');
es.onerror = () => $('dot').classList.remove('on');
es.addEventListener('changed', () => load());
es.addEventListener('log', (m) => log(JSON.parse(m.data).text));
es.addEventListener('task', (m) => {
  const d = JSON.parse(m.data);
  if (d.state === 'start') { S.running = d.task; log(`$ ${d.task}`); }
  else { S.running = null; $('runState').textContent = T.done(d.task, d.code); load(); }
  renderNav(); if (S.view === 'tools') renderTools(); if (S.view === 'agents') renderAgents(); if (S.view === 'today') renderToday();
});
setInterval(load, 60000);
const initial = location.hash.slice(1);
setView(T.nav[initial] ? initial : S.view);
load();
</script>
</body>
