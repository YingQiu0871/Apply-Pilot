<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2546c9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#shine)"/>
  <!-- flight path -->
  <path d="M196 812 C 290 812, 360 760, 418 676" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="34" stroke-linecap="round" stroke-dasharray="2 70"/>
  <!-- paper plane: upper wing and folded lower wing -->
  <path d="M818 220 L262 470 L486 560 Z" fill="#ffffff"/>
  <path d="M818 220 L486 560 L612 786 Z" fill="#ffffff" fill-opacity=".78"/>
</svg>
